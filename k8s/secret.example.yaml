apiVersion: v1
kind: Secret
metadata:
  name: github-agents
  namespace: github-agents-demo
type: Opaque
stringData:
  token: REPLACE_WITH_DISPOSABLE_GITHUB_TOKEN
  ssh-private-key: |
    REPLACE_WITH_DISPOSABLE_SSH_PRIVATE_KEY
  # API key for the Anthropic-compatible model provider (see MODEL_* in job.yaml).
  # nono's credential proxy holds it; the agents only ever see a placeholder.
  model-api-key: REPLACE_WITH_MODEL_PROVIDER_API_KEY
