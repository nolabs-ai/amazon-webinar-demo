apiVersion: v1
kind: Pod
metadata:
  name: github-agents-profile-validation
  namespace: github-agents-demo
  labels:
    app.kubernetes.io/name: github-agents-profile-validation
spec:
  runtimeClassName: kata-clh
  serviceAccountName: github-agents-demo
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
  tolerations:
    - key: kata
      operator: Equal
      value: "true"
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: validator
      image: 816301968846.dkr.ecr.eu-west-1.amazonaws.com/amazon-webinar-demo@sha256:6643d6cdf090f11802c4b4626b9a1ed425d55d51133c438220a0becc141e596b
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: github-credentials
          mountPath: /run/secrets/github
          readOnly: true
        - name: workspace
          mountPath: /workspace
        - name: nono-state
          mountPath: /home/node/.local/state/nono
  volumes:
    - name: github-credentials
      secret:
        secretName: github-agents
        defaultMode: 0440
    - name: workspace
      emptyDir: {}
    - name: nono-state
      emptyDir: {}
