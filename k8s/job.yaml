apiVersion: batch/v1
kind: Job
metadata:
  name: github-agents-demo
  namespace: github-agents-demo
# The image, the issue number and the repository are placeholders filled in by
# scripts/deploy.sh (envsubst), so this file is a template, not something to
# apply directly.
spec:
  backoffLimit: 0
  # A hung agent must not hold a Kata VM forever; run-demo has its own per-stage
  # timeouts well inside this.
  activeDeadlineSeconds: 2700
  # Logs are the demo's record; keep the Job long enough to read them, then let
  # Kubernetes clean up the pod and its emptyDirs.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-agents-demo
    spec:
      runtimeClassName: kata-clh
      serviceAccountName: github-agents-demo
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        katacontainers.io/kata-runtime: "true"
      tolerations:
        - key: kata
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agents
          # Always an immutable digest (scripts/build-image.sh prints it), never
          # a tag: the Job must run exactly the image that was rehearsed.
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /demo/bin/run-demo
          env:
            - name: AGENT_COMMAND
              value: pi
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: ISSUE_NUMBER
              value: "${ISSUE_NUMBER}"
            - name: GIT_REMOTE
              value: demo-secure
            - name: GIT_BRANCH
              value: demo/webinar-fix
            # Model access. The key itself comes from the Secret (model-api-key)
            # and is brokered by nono; these select where the calls go.
            # MODEL_API is Pi's wire protocol: anthropic-messages (Claude and
            # compatibles), openai-completions or openai-responses. The launcher
            # sets the proxy's auth header and allowed paths from it.
            # MODEL_UPSTREAM_URL is the provider's base URL (OpenAI-style ones end
            # in /v1) and MODEL_PROVIDER the Pi provider name.
            - name: MODEL_PROVIDER
              value: "${MODEL_PROVIDER}"
            - name: MODEL_ID
              value: "${MODEL_ID}"
            - name: MODEL_API
              value: "${MODEL_API}"
            - name: MODEL_UPSTREAM_URL
              value: "${MODEL_UPSTREAM_URL}"
            # verbose, or presenter to add the compact tagged view to the stream.
            - name: DEMO_OUTPUT
              value: "${DEMO_OUTPUT}"
            # Optional pause between the stages, for a rate-limited key.
            - name: STAGE_PAUSE
              value: "${STAGE_PAUSE}"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: github-credentials
              mountPath: /run/secrets/github
              readOnly: true
            - name: workspace
              mountPath: /workspace
            # nono's audit trail (it writes under $HOME/.local/state/nono). An
            # emptyDir keeps it off the image layer and out of the Secret.
            - name: nono-state
              mountPath: /home/node/.local/state/nono
      volumes:
        - name: github-credentials
          secret:
            secretName: github-agents
            # The files are root-owned and the container runs as uid 1000 with
            # fsGroup 1000, so the group needs read access: 0400 would make them
            # unreadable to the launcher. The agents are kept out by nono, not by
            # file mode (profiles grant them no access under /run/secrets).
            defaultMode: 0440
        - name: workspace
          emptyDir: {}
        - name: nono-state
          emptyDir: {}
