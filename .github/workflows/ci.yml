name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nono
        run: |
          set -euo pipefail
          version=$(tr -d '\n' < NONO_VERSION)
          target=x86_64-unknown-linux-gnu
          asset="nono-v${version}-${target}.tar.gz"
          base="https://github.com/nolabs-ai/nono/releases/download/v${version}"
          work=$(mktemp -d)
          trap 'rm -r "$work"' EXIT
          curl -fsSL "$base/$asset" -o "$work/$asset"
          curl -fsSL "$base/SHA256SUMS.txt" -o "$work/SHA256SUMS.txt"
          cd "$work"
          grep "  $asset$" SHA256SUMS.txt | sha256sum -c -
          tar -xzf "$asset"
          sudo install -m 0755 nono /usr/local/bin/nono

      - name: Test sample application
        run: python3 -m unittest discover -s demo_app -p 'test_*.py'

      - name: Test profiles
        run: scripts/test-profiles.sh
