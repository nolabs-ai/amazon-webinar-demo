name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nono
        run: |
          set -euo pipefail
          version=$(tr -d '\n' < NONO_VERSION)
          target=x86_64-unknown-linux-gnu
          asset="nono-v${version}-${target}.tar.gz"
          base="https://github.com/nolabs-ai/nono/releases/download/v${version}"
          work=$(mktemp -d)
          trap 'rm -r "$work"' EXIT
          curl -fsSL "$base/$asset" -o "$work/$asset"
          curl -fsSL "$base/SHA256SUMS.txt" -o "$work/SHA256SUMS.txt"
          cd "$work"
          grep "  $asset$" SHA256SUMS.txt | sha256sum -c -
          tar -xzf "$asset"
          sudo install -m 0755 nono /usr/local/bin/nono

      - name: Test sample application
        run: python3 -m unittest discover -s demo_app -p 'test_*.py'

      - name: Lint shell scripts
        run: shellcheck bin/run-demo bin/pi-agent scripts/*.sh

      - name: Test launcher (fake nono, Pi and GitHub)
        run: scripts/test-run-demo.sh

      - name: Test cluster scripts (fake kubectl)
        run: scripts/test-kube-scripts.sh

      - name: Test profiles
        run: scripts/test-profiles.sh

  manifests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned kubeconform
        run: |
          set -euo pipefail
          version=v0.7.0
          sha256=c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          work=$(mktemp -d)
          trap 'rm -r "$work"' EXIT
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/$version/kubeconform-linux-amd64.tar.gz" \
            -o "$work/kubeconform.tar.gz"
          echo "$sha256  $work/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$work/kubeconform.tar.gz" -C "$work" kubeconform
          sudo install -m 0755 "$work/kubeconform" /usr/local/bin/kubeconform

      # job.yaml is a template (image and issue number are placeholders), so
      # render it the way scripts/deploy.sh does before validating the schema.
      # The version is the cluster's (infra/terraform/variables.tf).
      - name: Validate manifests
        run: |
          set -euo pipefail
          export IMAGE="registry.example.invalid/demo@sha256:$(printf 'a%.0s' {1..64})" ISSUE_NUMBER=1 GITHUB_REPOSITORY=acme/widgets
          envsubst '${IMAGE} ${ISSUE_NUMBER} ${GITHUB_REPOSITORY}' < k8s/job.yaml > "$RUNNER_TEMP/job.yaml"
          grep -Eq 'image: .+@sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/job.yaml"
          kubeconform -strict -summary -kubernetes-version 1.35.0 \
            k8s/namespace.yaml k8s/service-account.yaml k8s/secret.example.yaml "$RUNNER_TEMP/job.yaml"

  image:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, no push)
        run: docker buildx build --platform linux/amd64 --load -f Containerfile -t amazon-webinar-demo:ci .

      - name: Check tools the profiles and preflight rely on
        run: |
          docker run --rm amazon-webinar-demo:ci bash -euc '
            test -x /usr/bin/gh -a -x /usr/bin/git -a -x /usr/bin/ssh
            for c in nono pi curl jq python3 ssh-agent ssh-add ssh-keygen rg timeout comm; do command -v "$c"; done
            gh pr checks --help >/dev/null
          '
