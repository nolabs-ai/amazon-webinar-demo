# Config fragment for the Kata guest kernel.
#
# build.sh copies this into Kata's configs/fragments/common/, so Kata's own
# merge step applies it on top of the stock x86_64 fragments and fails if an
# option does not land. Options the stock fragments already set are not repeated;
# verify-config.sh checks them on the result.

# Landlock, which nono requires and stock Kata does not enable.
CONFIG_SECURITY_LANDLOCK=y

# Active LSM order. Kata leaves CONFIG_LSM unset; LSMs that are not compiled in
# are skipped at boot.
CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf"

# Provides /sys/kernel/security/lsm, which lists the active LSMs.
CONFIG_SECURITYFS=y

# `uname -r` becomes <kernel version>-landlock. Keep in sync with versions.env.
CONFIG_LOCALVERSION="-landlock"

# Embed the config for /proc/config.gz and verify-config.sh.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
